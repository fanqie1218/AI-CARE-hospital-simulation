<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>AI-CARE 病房夜间高危巡检机器人 - 人机交互界面</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #0066CC;
            --dark-bg: #0a1628;
            --card-bg: #0f1d32;
            --border-color: #1a3a5c;
            --text-primary: #ffffff;
            --text-secondary: #8899aa;
            --safe-green: #00cc66;
            --warning-yellow: #ffcc00;
            --alert-orange: #ff8800;
            --danger-red: #ff3333;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ========== 头部标题栏 ========== */
        .header {
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 100%);
            border-bottom: 2px solid var(--primary-blue);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .header-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-blue);
            text-shadow: 0 0 20px rgba(0, 102, 204, 0.5);
        }

        .header-time {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .sim-clock{display:flex;align-items:center;gap:8px;background:rgba(0,136,255,.08);border:1px solid rgba(0,136,255,.2);border-radius:6px;padding:6px 14px}
        .sim-clock .clock-icon{font-size:18px;animation:clockPulse 2s infinite}
        @keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.6}}
        .sim-clock .clock-time{font-size:18px;font-weight:bold;color:#0088ff;font-family:Consolas,'Courier New',monospace;letter-spacing:1px}
        .sim-clock .clock-time .blink-colon{animation:colonBlink 1s infinite}
        @keyframes colonBlink{0%,100%{opacity:1}50%{opacity:.3}}
        .sim-clock .clock-period{font-size:10px;color:#5580aa;border-left:1px solid rgba(0,136,255,.2);padding-left:8px;line-height:1.4}
        .sim-clock .clock-period .period-name{color:#88bbee;font-weight:bold}

        .nav-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(0,136,255,.1);border:1px solid rgba(0,136,255,.3);border-radius:6px;color:#0088ff;font-size:12px;text-decoration:none;cursor:pointer;transition:all .2s}
        .nav-btn:hover{background:rgba(0,136,255,.2);border-color:#0088ff}

        /* ========== 主布局 - 三栏 ========== */
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
            gap: 15px;
            padding: 15px;
        }

        /* ========== 左栏 - 控制面板 ========== */
        .left-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        /* ========== 中栏 - 主显示区 ========== */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 0;
        }

        /* ========== 右栏 - 信息面板 ========== */
        .right-panel {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        /* ========== 卡片通用样式 ========== */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 0 15px rgba(0, 102, 204, 0.2);
        }

        .card-title {
            font-size: 16px;
            color: var(--primary-blue);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--primary-blue);
            border-radius: 2px;
        }

        /* ========== 床位录入区 ========== */
        .bed-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .bed-input {
            flex: 1;
            background: #0a1425;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            color: var(--text-primary);
            font-size: 20px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .bed-input:focus {
            border-color: var(--primary-blue);
        }

        .btn-confirm {
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-confirm:hover {
            background: #0077ee;
            transform: translateY(-2px);
        }

        .current-bed-display {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #0a2a4a 0%, #0a1628 100%);
            border-radius: 10px;
            border: 1px solid var(--primary-blue);
        }

        .current-bed-display .label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .current-bed-display .bed-number {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-blue);
            text-shadow: 0 0 30px rgba(0, 102, 204, 0.5);
        }

        /* ========== 路径控制区 ========== */
        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-control {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-reset {
            background: transparent;
            border-color: var(--warning-yellow);
            color: var(--warning-yellow);
        }

        .btn-reset:hover {
            background: rgba(255, 204, 0, 0.1);
        }

        .btn-start {
            background: transparent;
            border-color: var(--safe-green);
            color: var(--safe-green);
        }

        .btn-start:hover {
            background: rgba(0, 204, 102, 0.1);
        }

        .btn-start.active {
            background: var(--safe-green);
            color: var(--dark-bg);
        }

        .btn-stop {
            background: transparent;
            border-color: var(--danger-red);
            color: var(--danger-red);
        }

        .btn-stop:hover {
            background: rgba(255, 51, 51, 0.1);
        }

        .btn-stop.active {
            background: var(--danger-red);
            color: var(--dark-bg);
        }

        /* ========== 状态显示区 ========== */
        .status-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .status-level {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 10px;
            transition: all 0.5s ease;
            text-shadow: 0 0 40px currentColor;
        }

        .status-label {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        .status-bed-info {
            font-size: 18px;
            padding: 10px 25px;
            background: rgba(0, 102, 204, 0.1);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .countdown-timer {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary-blue);
            margin-top: 20px;
            font-family: 'Courier New', monospace;
        }

        /* 状态颜色 */
        .status-safe { color: var(--safe-green); }
        .status-sit { color: var(--warning-yellow); }
        .status-prepare { color: var(--alert-orange); }
        .status-fall { color: var(--danger-red); }

        /* 背景光晕 */
        .status-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            transition: all 0.5s;
            pointer-events: none;
        }

        /* ========== 火柴人Canvas区 ========== */
        .canvas-container {
            position: relative;
            background: #0a1425;
            border-radius: 12px;
            overflow: hidden;
        }

        #skeletonCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .pose-label {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 102, 204, 0.8);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        /* ========== 表情区 ========== */
        .emoji-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        .emoji-face {
            width: 100px;
            height: 100px;
            position: relative;
            transition: all 0.5s;
        }

        .emoji-face svg {
            width: 100%;
            height: 100%;
        }

        .emoji-label {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ========== 报警面板 ========== */
        .alarm-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alarm-item {
            background: #0a1425;
            border-radius: 8px;
            padding: 12px;
            border-left: 4px solid;
            transition: all 0.3s;
        }

        .alarm-item.level-safe { border-left-color: var(--safe-green); }
        .alarm-item.level-sit { border-left-color: var(--warning-yellow); }
        .alarm-item.level-prepare { border-left-color: var(--alert-orange); }
        .alarm-item.level-fall { border-left-color: var(--danger-red); }

        .alarm-item:hover {
            background: #0f1d32;
            transform: translateX(5px);
        }

        .alarm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alarm-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .alarm-bed {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-blue);
        }

        .alarm-status {
            font-size: 13px;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        /* ========== JSON数据面板 ========== */
        .json-display {
            background: #0a1425;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #66ddaa;
            overflow-y: auto;
            max-height: 200px;
            line-height: 1.6;
        }

        .json-key { color: #8899cc; }
        .json-string { color: #66ddaa; }
        .json-number { color: #ffaa44; }
        .json-boolean { color: #ff6688; }

        /* ========== 滚动条样式 ========== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-blue);
        }

        /* ========== 系统状态栏 ========== */
        .status-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--safe-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ========== 状态指示灯 ========== */
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .indicator-green { background: var(--safe-green); box-shadow: 0 0 10px var(--safe-green); }
        .indicator-yellow { background: var(--warning-yellow); box-shadow: 0 0 10px var(--warning-yellow); }
        .indicator-orange { background: var(--alert-orange); box-shadow: 0 0 10px var(--alert-orange); }
        .indicator-red { background: var(--danger-red); box-shadow: 0 0 10px var(--danger-red); }

        /* ========== 快捷床位按钮 ========== */
        .quick-beds {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .btn-quick-bed {
            background: #0a1425;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-quick-bed:hover {
            border-color: var(--primary-blue);
            background: rgba(0, 102, 204, 0.2);
        }

        .btn-quick-bed.active {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
        }

        /* ========== MQTT日志面板 ========== */
        .mqtt-log {
            background: #0a1425;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            overflow-y: auto;
            flex: 1;
            line-height: 1.8;
        }

        .mqtt-log .timestamp {
            color: #666;
        }

        .mqtt-log .topic {
            color: var(--primary-blue);
        }

        .mqtt-log .payload {
            color: #66ddaa;
        }

        /* ========== 动画 ========== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .alarm-item {
            animation: fadeIn 0.3s ease;
        }

        /* ========== 巡检进度条 ========== */
        .patrol-progress {
            margin-top: 15px;
        }

        .progress-bar {
            height: 8px;
            background: #0a1425;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--safe-green));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- ========== 头部标题栏 ========== -->
    <div class="header">
        <div class="header-title">AI-CARE 病房夜间高危巡检机器人</div>
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot"></span>
                <span>系统在线</span>
            </div>
            <div class="status-item">
                <span class="status-dot"></span>
                <span>K230连接正常</span>
            </div>
            <div class="status-item">
                <span class="status-dot"></span>
                <span>MQTT已连接</span>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
            <div class="sim-clock">
                <span class="clock-icon" id="clockIcon">🌙</span>
                <div>
                    <div class="clock-time" id="headerTime">22<span class="blink-colon">:</span>00<span class="blink-colon">:</span>00</div>
                    <div class="clock-period" id="clockPeriod"><span class="period-name">夜间巡检</span> 高危时段</div>
                </div>
            </div>
            <a class="nav-btn" href="simulation.html" title="打开机器人仿真系统">🤖 机器人仿真</a>
        </div>
    </div>

    <!-- ========== 主容器 ========== -->
    <div class="main-container">
        <!-- ========== 左栏 - 控制面板 ========== -->
        <div class="left-panel">
            <!-- 床位录入区 -->
            <div class="card">
                <div class="card-title">床位号录入</div>
                <div class="bed-input-group">
                    <input type="number" class="bed-input" id="bedInput" min="1" max="255" placeholder="1-255" value="1">
                    <button class="btn-confirm" onclick="confirmBed()">确认</button>
                </div>
                <div class="current-bed-display">
                    <div class="label">当前观测病床</div>
                    <div class="bed-number" id="currentBedDisplay">001</div>
                </div>
                <div class="quick-beds">
                    <button class="btn-quick-bed active" onclick="selectQuickBed(1)">1</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(2)">2</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(3)">3</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(5)">5</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(8)">8</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(10)">10</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(12)">12</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(15)">15</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(20)">20</button>
                    <button class="btn-quick-bed" onclick="selectQuickBed(25)">25</button>
                </div>
            </div>

            <!-- 路径控制区 -->
            <div class="card">
                <div class="card-title">巡检路径控制</div>
                <div class="control-buttons">
                    <button class="btn-control btn-reset" onclick="resetPatrol()">
                        <span>🔄</span> 重置巡检路径
                    </button>
                    <button class="btn-control btn-start" id="btnStart" onclick="togglePatrol()">
                        <span id="startIcon">▶</span> <span id="startText">开始巡检</span>
                    </button>
                    <button class="btn-control btn-stop" id="btnStop" onclick="stopPatrol()">
                        <span>⏹</span> 紧急停止
                    </button>
                </div>
                <div class="patrol-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="progress-info">
                        <span>巡检进度</span>
                        <span id="progressText">0%</span>
                    </div>
                </div>
            </div>

            <!-- 系统状态 -->
            <div class="card">
                <div class="card-title">系统状态</div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="status-item">
                        <span class="indicator indicator-green"></span>
                        <span>机器人底盘</span>
                        <span style="margin-left: auto; color: var(--safe-green);">正常</span>
                    </div>
                    <div class="status-item">
                        <span class="indicator indicator-green"></span>
                        <span>K230视觉模块</span>
                        <span style="margin-left: auto; color: var(--safe-green);">正常</span>
                    </div>
                    <div class="status-item">
                        <span class="indicator indicator-green"></span>
                        <span>MQTT通信</span>
                        <span style="margin-left: auto; color: var(--safe-green);">正常</span>
                    </div>
                    <div class="status-item">
                        <span class="indicator indicator-green"></span>
                        <span>激光雷达</span>
                        <span style="margin-left: auto; color: var(--safe-green);">正常</span>
                    </div>
                    <div class="status-item">
                        <span class="indicator indicator-green"></span>
                        <span>电池电量</span>
                        <span style="margin-left: auto; color: var(--safe-green);">87%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== 中栏 - 主显示区 ========== -->
        <div class="center-panel">
            <!-- 状态大字显示 -->
            <div class="card status-display">
                <div class="status-glow" id="statusGlow"></div>
                <div class="status-level" id="statusLevel">安全</div>
                <div class="status-label" id="statusLabel">当前危险等级</div>
                <div class="status-bed-info">
                    观测病床: <strong id="statusBed">001</strong> 号
                </div>
                <div class="countdown-timer" id="countdownTimer">00:03</div>
                <div style="margin-top: 15px; font-size: 14px; color: var(--text-secondary);">
                    下次数据更新倒计时
                </div>
            </div>

            <!-- 火柴人Canvas + 表情区 -->
            <div style="display: flex; gap: 15px; flex: 1;">
                <!-- 火柴人展示区 -->
                <div class="card canvas-container" style="flex: 2;">
                    <canvas id="skeletonCanvas"></canvas>
                    <div class="canvas-overlay">
                        K230 脱敏骨骼数据 - 17关键点
                    </div>
                    <div class="pose-label" id="poseLabel">姿态: 平躺</div>
                </div>

                <!-- 表情区 -->
                <div class="card" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div class="card-title" style="width: 100%;">夜间虚拟表情</div>
                    <div class="emoji-face" id="emojiFace">
                        <!-- 安全表情 - 微笑 -->
                        <svg viewBox="0 0 100 100" id="emojiSvg">
                            <circle cx="50" cy="50" r="45" fill="#00cc66" opacity="0.2" stroke="#00cc66" stroke-width="2"/>
                            <circle cx="35" cy="40" r="5" fill="#00cc66"/>
                            <circle cx="65" cy="40" r="5" fill="#00cc66"/>
                            <path d="M 30 60 Q 50 80 70 60" stroke="#00cc66" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="emoji-label" id="emojiLabel">安全 - 正常巡检中</div>
                    <div style="margin-top: 20px; text-align: center;">
                        <div style="font-size: 48px;" id="emojiIcon">😊</div>
                    </div>
                </div>
            </div>

        <!-- ========== 右栏 - 信息面板 ========== -->
        <div class="right-panel">
            <!-- 报警信息面板 -->

                    <!-- 动态生成 -->
                </div>

            <!-- MQTT数据面板 -->
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <div class="card-title">MQTT 数据推送</div>
                <div class="json-display" id="jsonDisplay">
                    <!-- 动态生成 -->
                </div>

            <!-- MQTT日志 -->
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <div class="card-title">通信日志</div>

    <!-- ========== JavaScript ========== -->
    <script>
        // ========== 全局状态 ==========
        const state = {
            currentBed: 1,
            isPatrolling: false,
            patrolProgress: 0,
            currentStatus: 'safe', // safe, sit, prepare, fall
            countdown: 3,
            alarms: [],
            mqttMessages: [],
            skeletonPose: 'lying' // lying, sitting, leaving, falling
        };

        // 状态配置
        const statusConfig = {
            safe: { level: '安全', color: '#00cc66', cssClass: 'status-safe', emoji: '😊', emojiLabel: '安全 - 正常巡检中' },
            sit: { level: '起坐', color: '#ffcc00', cssClass: 'status-sit', emoji: '😟', emojiLabel: '警戒 - 检测到起坐' },
            prepare: { level: '离床准备', color: '#ff8800', cssClass: 'status-prepare', emoji: '😨', emojiLabel: '警告 - 离床准备中' },
            fall: { level: '坠床跌倒', color: '#ff3333', cssClass: 'status-fall', emoji: '🚨', emojiLabel: '危险 - 坠床跌倒报警!' }
        };

        // 姿态配置
        const poseConfig = {
            lying: '平躺',
            sitting: '坐起',
            leaving: '离床',
            falling: '跌倒'
        };

        // ========== 时间更新 ==========
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('headerTime').innerHTML = h + '<span class="blink-colon">:</span>' + m + '<span class="blink-colon">:</span>' + s;

            // 更新时段图标和文字
            const hour = now.getHours();
            let icon = '🌙', period = '夜间巡检', sub = '高危时段';
            if (hour >= 5 && hour < 7) { icon = '🌅'; period = '清晨'; sub = '天色渐亮'; }
            else if (hour >= 7 && hour < 9) { icon = '☀️'; period = '早晨'; sub = '交班时段'; }
            else if (hour >= 9 && hour < 12) { icon = '☀️'; period = '上午'; sub = '日间巡查'; }
            else if (hour >= 12 && hour < 14) { icon = '🌤️'; period = '中午'; sub = '午间休息'; }
            else if (hour >= 14 && hour < 17) { icon = '☀️'; period = '下午'; sub = '日间巡查'; }
            else if (hour >= 17 && hour < 19) { icon = '🌇'; period = '傍晚'; sub = '交接时段'; }
            else if (hour >= 19 && hour < 22) { icon = '🌆'; period = '夜间'; sub = '就寝准备'; }
            document.getElementById('clockIcon').textContent = icon;
            document.getElementById('clockPeriod').innerHTML = '<span class="period-name">' + period + '</span> ' + sub;
        }

        setInterval(updateTime, 1000);
        updateTime();

        // ========== 床位控制 ==========
        function confirmBed() {
            const input = document.getElementById('bedInput');
            let bedNum = parseInt(input.value);

            if (isNaN(bedNum) || bedNum < 1 || bedNum > 255) {
                alert('请输入有效的床位号 (1-255)');
                return;
            }

            state.currentBed = bedNum;
            updateBedDisplay();
            addMqttLog('bed/set', JSON.stringify({ bed_id: bedNum }));
        }

        function selectQuickBed(num) {
            state.currentBed = num;
            document.getElementById('bedInput').value = num;
            updateBedDisplay();

            // 更新快捷按钮状态
            document.querySelectorAll('.btn-quick-bed').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === num);
            });

            addMqttLog('bed/set', JSON.stringify({ bed_id: num }));
        }

        function updateBedDisplay() {
            const display = document.getElementById('currentBedDisplay');
            const statusBed = document.getElementById('statusBed');
            display.textContent = String(state.currentBed).padStart(3, '0');
            statusBed.textContent = String(state.currentBed).padStart(3, '0');
        }

        // ========== 巡检控制 ==========
        function resetPatrol() {
            state.patrolProgress = 0;
            state.isPatrolling = false;
            updatePatrolUI();
            addMqttLog('patrol/reset', JSON.stringify({ action: 'reset' }));
            addAlarm('safe', '巡检路径已重置');
        }

        function togglePatrol() {
            state.isPatrolling = !state.isPatrolling;
            updatePatrolUI();
            addMqttLog('patrol/toggle', JSON.stringify({ running: state.isPatrolling }));
        }

        function stopPatrol() {
            state.isPatrolling = false;
            state.patrolProgress = 0;
            updatePatrolUI();
            addMqttLog('patrol/stop', JSON.stringify({ action: 'emergency_stop' }));
            addAlarm('safe', '紧急停止已触发');
        }

        function updatePatrolUI() {
            const btnStart = document.getElementById('btnStart');
            const startIcon = document.getElementById('startIcon');
            const startText = document.getElementById('startText');

            if (state.isPatrolling) {
                btnStart.classList.add('active');
                startIcon.textContent = '⏸';
                startText.textContent = '暂停巡检';
            } else {
                btnStart.classList.remove('active');
                startIcon.textContent = '▶';
                startText.textContent = '开始巡检';
            }
        }

        // ========== 状态更新 ==========
        function updateStatus(newStatus) {
            state.currentStatus = newStatus;
            const config = statusConfig[newStatus];

            // 更新状态大字
            const statusLevel = document.getElementById('statusLevel');
            statusLevel.textContent = config.level;
            statusLevel.className = 'status-level ' + config.cssClass;

            // 更新背景光晕
            const glow = document.getElementById('statusGlow');
            glow.style.background = config.color;

            // 更新表情
            updateEmoji(newStatus);

            // 更新火柴人姿态
            const poseMap = { safe: 'lying', sit: 'sitting', prepare: 'leaving', fall: 'falling' };
            state.skeletonPose = poseMap[newStatus];
            document.getElementById('poseLabel').textContent = '姿态: ' + poseConfig[state.skeletonPose];

            // 如果是危险状态，添加报警
            if (newStatus === 'fall') {
                addAlarm(newStatus, '检测到坠床跌倒!');
            } else if (newStatus === 'prepare') {
                addAlarm(newStatus, '检测到离床准备');
            }
        }

        function updateEmoji(status) {
            const config = statusConfig[status];
            document.getElementById('emojiLabel').textContent = config.emojiLabel;
            document.getElementById('emojiIcon').textContent = config.emoji;

            // 更新SVG表情
            const svg = document.getElementById('emojiSvg');
            const color = config.color;

            if (status === 'safe') {
                svg.innerHTML = `
                    <circle cx="50" cy="50" r="45" fill="${color}" opacity="0.2" stroke="${color}" stroke-width="2"/>
                    <circle cx="35" cy="40" r="5" fill="${color}"/>
                    <circle cx="65" cy="40" r="5" fill="${color}"/>
                    <path d="M 30 60 Q 50 80 70 60" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/>
                `;
            } else if (status === 'sit') {
                svg.innerHTML = `
                    <circle cx="50" cy="50" r="45" fill="${color}" opacity="0.2" stroke="${color}" stroke-width="2"/>
                    <circle cx="35" cy="40" r="5" fill="${color}"/>
                    <circle cx="65" cy="40" r="5" fill="${color}"/>
                    <line x1="30" y1="65" x2="70" y2="65" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
                `;
            } else if (status === 'prepare') {
                svg.innerHTML = `
                    <circle cx="50" cy="50" r="45" fill="${color}" opacity="0.2" stroke="${color}" stroke-width="2"/>
                    <circle cx="35" cy="38" r="6" fill="${color}"/>
                    <circle cx="65" cy="38" r="6" fill="${color}"/>
                    <path d="M 30 65 Q 50 55 70 65" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/>
                `;
            } else {
                svg.innerHTML = `
                    <circle cx="50" cy="50" r="45" fill="${color}" opacity="0.3" stroke="${color}" stroke-width="3"/>
                    <line x1="30" y1="35" x2="40" y2="45" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
                    <line x1="40" y1="35" x2="30" y2="45" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
                    <line x1="60" y1="35" x2="70" y2="45" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
                    <line x1="70" y1="35" x2="60" y2="45" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="50" cy="65" r="8" fill="none" stroke="${color}" stroke-width="3"/>
                    <line x1="50" y1="57" x2="50" y2="53" stroke="${color}" stroke-width="3"/>
                `;
            }
        }

        // ========== 报警记录 ==========
        function addAlarm(level, message) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN');

            const alarm = {
                time: timeStr,
                bed: state.currentBed,
                level: level,
                message: message,
                statusCode: getStatusCode(level)
            };

            state.alarms.unshift(alarm);
            if (state.alarms.length > 20) state.alarms.pop();

            renderAlarms();
            updateJsonDisplay();
        }

        function getStatusCode(level) {
            const codes = { safe: 0, sit: 1, prepare: 2, fall: 3 };
            return codes[level] || 0;
        }

        function renderAlarms() {
            const container = document.getElementById('alarmList');
            container.innerHTML = state.alarms.map(alarm => `
                <div class="alarm-item level-${alarm.level}">
                    <div class="alarm-header">
                        <span class="alarm-bed">床位 ${String(alarm.bed).padStart(3, '0')}</span>
                        <span class="alarm-time">${alarm.time}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="alarm-status" style="background: ${statusConfig[alarm.level].color}22; color: ${statusConfig[alarm.level].color};">
                            ${alarm.message}
                        </span>
                        <span style="font-size: 12px; color: var(--text-secondary);">状态码: ${alarm.statusCode}</span>
                    </div>
                </div>
            `).join('');
        }

        // ========== MQTT数据展示 ==========
        function updateJsonDisplay() {
            const container = document.getElementById('jsonDisplay');
            const data = {
                timestamp: new Date().toISOString(),
                device_id: "AI-CARE-001",
                bed_id: state.currentBed,
                status_code: getStatusCode(state.currentStatus),
                status_text: statusConfig[state.currentStatus].level,
                skeleton_data: {
                    key_points: 17,
                    pose: state.skeletonPose,
                    confidence: (0.85 + Math.random() * 0.15).toFixed(2)
                },
                location: {
                    x: (Math.random() * 10).toFixed(2),
                    y: (Math.random() * 10).toFixed(2),
                    theta: (Math.random() * Math.PI).toFixed(4)
                },
                battery: 87,
                patrol_progress: state.patrolProgress
            };

            container.innerHTML = syntaxHighlight(JSON.stringify(data, null, 2));
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        // ========== MQTT日志 ==========
        function addMqttLog(topic, payload) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });

            const logEntry = `<span class="timestamp">[${timeStr}]</span> <span class="topic">${topic}</span> <span class="payload">${payload}</span>`;

            state.mqttMessages.unshift(logEntry);
            if (state.mqttMessages.length > 50) state.mqttMessages.pop();

            const container = document.getElementById('mqttLog');
            container.innerHTML = state.mqttMessages.join('<br>');
        }

        // ========== 火柴人Canvas绘制 ==========
        const canvas = document.getElementById('skeletonCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 骨骼连接定义
        const skeletonConnections = [
            [0, 1], [0, 2],     // 头 -> 鼻, 头 -> 左眼 (简化)
            [1, 3], [1, 4],     // 鼻 -> 左耳, 鼻 -> 右耳
            [3, 5], [4, 6],     // 左耳 -> 左肩, 右耳 -> 右肩
            [5, 7], [7, 9],     // 左肩 -> 左肘 -> 左腕
            [6, 8], [8, 10],    // 右肩 -> 右肘 -> 右腕
            [5, 11], [6, 12],   // 肩 -> 髋
            [11, 12],           // 左髋 -> 右髋
            [11, 13], [13, 15], // 左髋 -> 左膝 -> 左踝
            [12, 14], [14, 16]  // 右髋 -> 右膝 -> 右踝
        ];

        // 不同姿态的关键点
        const poses = {
            lying: [
                { x: 0.5, y: 0.2 },   // 0: 头
                { x: 0.5, y: 0.25 },  // 1: 鼻
                { x: 0.45, y: 0.22 }, // 2: 左眼
                { x: 0.55, y: 0.22 }, // 3: 右眼
                { x: 0.42, y: 0.2 },  // 4: 左耳
                { x: 0.58, y: 0.2 },  // 5: 右耳
                { x: 0.35, y: 0.3 },  // 6: 左肩
                { x: 0.65, y: 0.3 },  // 7: 右肩
                { x: 0.25, y: 0.35 }, // 8: 左肘
                { x: 0.75, y: 0.35 }, // 9: 右肘
                { x: 0.15, y: 0.4 },  // 10: 左腕
                { x: 0.85, y: 0.4 },  // 11: 右腕
                { x: 0.4, y: 0.5 },   // 12: 左髋
                { x: 0.6, y: 0.5 },   // 13: 右髋
                { x: 0.35, y: 0.65 }, // 14: 左膝
                { x: 0.65, y: 0.65 }, // 15: 右膝
                { x: 0.3, y: 0.8 },   // 16: 左踝
                { x: 0.7, y: 0.8 }    // 17: 右踝
            ],
            sitting: [
                { x: 0.5, y: 0.15 },  // 0: 头
                { x: 0.5, y: 0.2 },   // 1: 鼻
                { x: 0.45, y: 0.17 }, // 2: 左眼
                { x: 0.55, y: 0.17 }, // 3: 右眼
                { x: 0.42, y: 0.15 }, // 4: 左耳
                { x: 0.58, y: 0.15 }, // 5: 右耳
                { x: 0.35, y: 0.3 },  // 6: 左肩
                { x: 0.65, y: 0.3 },  // 7: 右肩
                { x: 0.25, y: 0.4 },  // 8: 左肘
                { x: 0.75, y: 0.4 },  // 9: 右肘
                { x: 0.2, y: 0.5 },   // 10: 左腕
                { x: 0.8, y: 0.5 },   // 11: 右腕
                { x: 0.4, y: 0.5 },   // 12: 左髋
                { x: 0.6, y: 0.5 },   // 13: 右髋
                { x: 0.35, y: 0.7 },  // 14: 左膝
                { x: 0.65, y: 0.7 },  // 15: 右膝
                { x: 0.3, y: 0.85 },  // 16: 左踝
                { x: 0.7, y: 0.85 }   // 17: 右踝
            ],
            leaving: [
                { x: 0.5, y: 0.1 },   // 0: 头
                { x: 0.5, y: 0.15 },  // 1: 鼻
                { x: 0.45, y: 0.12 }, // 2: 左眼
                { x: 0.55, y: 0.12 }, // 3: 右眼
                { x: 0.42, y: 0.1 },  // 4: 左耳
                { x: 0.58, y: 0.1 },  // 5: 右耳
                { x: 0.35, y: 0.25 }, // 6: 左肩
                { x: 0.65, y: 0.25 }, // 7: 右肩
                { x: 0.25, y: 0.35 }, // 8: 左肘
                { x: 0.75, y: 0.35 }, // 9: 右肘
                { x: 0.2, y: 0.45 },  // 10: 左腕
                { x: 0.8, y: 0.45 },  // 11: 右腕
                { x: 0.4, y: 0.45 },  // 12: 左髋
                { x: 0.6, y: 0.45 },  // 13: 右髋
                { x: 0.38, y: 0.65 }, // 14: 左膝
                { x: 0.62, y: 0.65 }, // 15: 右膝
                { x: 0.35, y: 0.85 }, // 16: 左踝
                { x: 0.65, y: 0.85 }  // 17: 右踝
            ],
            falling: [
                { x: 0.6, y: 0.3 },   // 0: 头
                { x: 0.55, y: 0.35 }, // 1: 鼻
                { x: 0.58, y: 0.28 }, // 2: 左眼
                { x: 0.62, y: 0.28 }, // 3: 右眼
                { x: 0.55, y: 0.25 }, // 4: 左耳
                { x: 0.65, y: 0.25 }, // 5: 右耳
                { x: 0.4, y: 0.45 },  // 6: 左肩
                { x: 0.7, y: 0.45 },  // 7: 右肩
                { x: 0.3, y: 0.55 },  // 8: 左肘
                { x: 0.8, y: 0.5 },   // 9: 右肘
                { x: 0.2, y: 0.65 },  // 10: 左腕
                { x: 0.85, y: 0.6 },  // 11: 右腕
                { x: 0.45, y: 0.65 }, // 12: 左髋
                { x: 0.65, y: 0.65 }, // 13: 右髋
                { x: 0.35, y: 0.75 }, // 14: 左膝
                { x: 0.7, y: 0.75 },  // 15: 右膝
                { x: 0.25, y: 0.85 }, // 16: 左踝
                { x: 0.75, y: 0.85 }  // 17: 右踝
            ]
        };

        let currentPosePoints = [...poses.lying];
        let targetPosePoints = [...poses.lying];
        let animProgress = 1;

        function drawSkeleton() {
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // 绘制背景网格
            ctx.strokeStyle = 'rgba(0, 102, 204, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < w; i += 30) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, h);
                ctx.stroke();
            }
            for (let i = 0; i < h; i += 30) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(w, i);
                ctx.stroke();
            }

            // 插值动画
            if (animProgress < 1) {
                animProgress += 0.05;
                if (animProgress > 1) animProgress = 1;

                for (let i = 0; i < currentPosePoints.length; i++) {
                    currentPosePoints[i].x += (targetPosePoints[i].x - currentPosePoints[i].x) * 0.1;
                    currentPosePoints[i].y += (targetPosePoints[i].y - currentPosePoints[i].y) * 0.1;
                }
            }

            // 绘制连线
            ctx.strokeStyle = '#0066CC';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            skeletonConnections.forEach(([a, b]) => {
                if (a < currentPosePoints.length && b < currentPosePoints.length) {
                    ctx.beginPath();
                    ctx.moveTo(currentPosePoints[a].x * w, currentPosePoints[a].y * h);
                    ctx.lineTo(currentPosePoints[b].x * w, currentPosePoints[b].y * h);
                    ctx.stroke();
                }
            });

            // 绘制关键点
            currentPosePoints.forEach((point, index) => {
                const x = point.x * w;
                const y = point.y * h;
                const radius = index === 0 ? 12 : 6;

                // 发光效果
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius * 2);
                gradient.addColorStop(0, 'rgba(0, 204, 102, 0.8)');
                gradient.addColorStop(1, 'rgba(0, 204, 102, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, radius * 2, 0, Math.PI * 2);
                ctx.fill();

                // 实心点
                ctx.fillStyle = index === 0 ? '#00cc66' : '#00aaff';
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();

                // 边框
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function changePose(poseName) {
            if (poses[poseName]) {
                targetPosePoints = poses[poseName].map(p => ({ ...p }));
                animProgress = 0;
            }
        }

        // 动画循环
        function animate() {
            drawSkeleton();
            requestAnimationFrame(animate);
        }

        animate();

        // ========== 模拟数据更新 ==========
        let dataUpdateTimer = null;
        let countdownValue = 3;

        function startDataSimulation() {
            // 清除旧的定时器
            if (dataUpdateTimer) clearInterval(dataUpdateTimer);

            countdownValue = 3;
            updateCountdown();

            dataUpdateTimer = setInterval(() => {
                countdownValue--;

                if (countdownValue <= 0) {
                    // 随机切换状态
                    const statuses = ['safe', 'safe', 'safe', 'sit', 'sit', 'prepare', 'fall'];
                    const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];

                    updateStatus(randomStatus);

                    // 更新巡检进度
                    if (state.isPatrolling) {
                        state.patrolProgress = Math.min(100, state.patrolProgress + Math.random() * 15);
                        document.getElementById('progressFill').style.width = state.patrolProgress + '%';
                        document.getElementById('progressText').textContent = Math.round(state.patrolProgress) + '%';

                        if (state.patrolProgress >= 100) {
                            state.patrolProgress = 0;
                            addAlarm('safe', '巡检完成，开始新一轮');
                        }
                    }

                    // 添加MQTT日志
                    addMqttLog('sensor/data', JSON.stringify({
                        bed_id: state.currentBed,
                        status: state.currentStatus,
                        pose: state.skeletonPose
                    }));

                    countdownValue = 2 + Math.floor(Math.random() * 2); // 2-3秒
                }

                updateCountdown();
            }, 1000);
        }

        function updateCountdown() {
            document.getElementById('countdownTimer').textContent =
                '00:0' + countdownValue;
        }

        // ========== 初始化 ==========
        function init() {
            // 初始化报警记录
            addAlarm('safe', '系统启动完成');
            addAlarm('safe', 'K230视觉模块已连接');
            addAlarm('safe', 'MQTT通信建立成功');

            // 初始化MQTT日志
            addMqttLog('system/init', JSON.stringify({ status: 'ok', version: '1.0.0' }));
            addMqttLog('k230/connect', JSON.stringify({ ip: '192.168.1.100', port: 8080 }));
            addMqttLog('mqtt/connect', JSON.stringify({ broker: '192.168.1.1', port: 1883 }));

            // 初始化JSON显示
            updateJsonDisplay();

            // 启动数据模拟
            startDataSimulation();

            // 监听输入框回车
            document.getElementById('bedInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') confirmBed();
            });
        }

        // 页面加载后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
